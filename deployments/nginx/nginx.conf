# ====================================================================
# Nginx API Gateway — MLOps exam
# Reverse proxy + load balancing + HTTPS + basic auth + rate limiting
# + A/B testing + a status endpoint for Prometheus.
# ====================================================================

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/json;

    # Docker DNS server. Required so the upstream hostnames
    # below are re-resolved at REQUEST time (because they're used via a
    # $variable in proxy_pass). This is what makes Nginx round-robin
    # across the 3 api-v1 replicas instead of caching one IP at startup.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # --- Rate limiting ---
    # Shared-memory zone keyed by client IP, capped at 10 requests/sec.
    limit_req_zone $binary_remote_addr zone=predict_limit:10m rate=10r/s;
    limit_req_status 429;   # 429 Too Many Requests when the limit is exceeded

    # --- A/B routing ---
    # Choose the backend service from the X-Experiment-Group header.
    # "debug" -> api-v2 (verbose); anything else -> api-v1 (standard).
    map $http_x_experiment_group $api_backend {
        default  "api-v1";
        "debug"  "api-v2";
    }

    # ----------------------------------------------------------------
    # HTTP :80  ->  redirect everything to HTTPS 
    # ----------------------------------------------------------------
    server {
        listen 80;
        server_name localhost;
        return 301 https://$host$request_uri;
    }

    # ----------------------------------------------------------------
    # HTTPS :443  ->  the real gateway 
    # ----------------------------------------------------------------
    server {
        listen 443 ssl;
        server_name localhost;

        # Self-signed cert + key generated 
        ssl_certificate     /etc/nginx/certs/nginx.crt;
        ssl_certificate_key /etc/nginx/certs/nginx.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        # Prediction endpoint: protected + rate-limited + A/B routed.
        location /predict {
            # HTTP basic authentication.
            auth_basic           "Restricted - Prediction API";
            auth_basic_user_file /etc/nginx/.htpasswd;

            # enforce the rate limit. burst absorbs short
            # enforce the rate limit. burst absorbs short
            # spikes; nodelay serves them immediately instead of queuing.
            limit_req zone=predict_limit burst=20 nodelay;

            #  proxy to the chosen backend. The $variable
            # forces per-request DNS resolution -> load balancing for v1.
            proxy_pass http://$api_backend:8000;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ----------------------------------------------------------------
    # Internal :8080  ->  stub_status for the Prometheus nginx-exporter
    # This port is NOT published to the host, so it's only
    # reachable from inside the Docker network.
    # ----------------------------------------------------------------
    server {
        listen 8080;
        server_name localhost;

        location /stub_status {
            stub_status;
        }
    }
}
